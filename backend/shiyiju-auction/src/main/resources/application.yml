server:
  port: 8084
spring:
  application:
    name: shiyiju-auction
  cloud:
    nacos:
      discovery:
        enabled: false
        server-addr: 127.0.0.1:8848
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/shiyiju_local?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      database: ${SPRING_DATA_REDIS_DATABASE:0}
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.shiyiju.auction.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
logging:
  level:
    com.shiyiju: ${APP_LOG_LEVEL:INFO}
auction:
  seed-demo: ${AUCTION_SEED_DEMO:false}
  public-base-url: ${AUCTION_PUBLIC_BASE_URL:https://a.art1.cn}
  admin-api-key: ${AUCTION_ADMIN_API_KEY:}
alipay:
  enabled: ${ALIPAY_ENABLED:false}
  app-id: ${ALIPAY_APP_ID:}
  private-key: ${ALIPAY_PRIVATE_KEY:}
  alipay-public-key: ${ALIPAY_PUBLIC_KEY:}
  notify-url: ${ALIPAY_NOTIFY_URL:https://a.art1.cn/api/auction/pay/alipay/notify}
  return-url: ${ALIPAY_RETURN_URL:https://a.art1.cn/#/pages/auction/index}
wxpay:
  app-id: ${WXPAY_APP_ID:}
  official-app-id: ${WXPAY_OFFICIAL_APP_ID:}
  mini-app-id: ${WXPAY_MINI_APP_ID:}
  mch-id: ${WXPAY_MCH_ID:}
  mch-key: ${WXPAY_MCH_KEY:}
  api-key: ${WXPAY_API_KEY:}
  key-path: ${WXPAY_KEY_PATH:}
  notify-url: ${WXPAY_NOTIFY_URL:https://a.art1.cn/api/auction/pay/wechat/notify}
