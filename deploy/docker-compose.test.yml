# 拾艺局 测试环境 Docker Compose
# 使用: docker compose -f deploy/docker-compose.test.yml up -d

version: '3.8'

networks:
  shiyiju-test:
    driver: bridge

services:
  # ======================== 基础服务 ========================

  mysql:
    image: mysql:8.0
    container_name: shiyiju-test-mysql
    restart: unless-stopped
    networks:
      - shiyiju-test
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: test_password_2026
      MYSQL_DATABASE: shiyiju_test
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./sql/:/docker-entrypoint-initdb.d/:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 15s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: shiyiju-test-redis
    restart: unless-stopped
    networks:
      - shiyiju-test
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 3s
      retries: 10

  # ======================== 后端服务 ========================

  gateway:
    build:
      context: ../backend
      dockerfile: deploy/docker/Dockerfile
    image: shiyiju-test-backend:latest
    container_name: shiyiju-test-gateway
    restart: unless-stopped
    networks:
      - shiyiju-test
    ports:
      - "8080:8080"
    environment:
      SERVICE: gateway
      SPRING_PROFILES_ACTIVE: test
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/shiyiju_test?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: test_password_2026
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      WECHAT_APPID: ${WECHAT_APPID:-wx53de6703ba23756d}
      WECHAT_SECRET: ${WECHAT_SECRET:-181653dd5e2aa1fcca1b34c61155d15c2}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  user-service:
    image: shiyiju-test-backend:latest
    container_name: shiyiju-test-user
    restart: unless-stopped
    networks:
      - shiyiju-test
    ports:
      - "8081:8081"
    environment:
      SERVICE: user
      SPRING_PROFILES_ACTIVE: test
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/shiyiju_test?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: test_password_2026
      SPRING_DATA_REDIS_HOST: redis
      WECHAT_APPID: ${WECHAT_APPID:-wx53de6703ba23756d}
      WECHAT_SECRET: ${WECHAT_SECRET:-181653dd5e2aa1fcca1b34c61155d15c2}
    depends_on:
      - mysql
      - redis

  product-service:
    image: shiyiju-test-backend:latest
    container_name: shiyiju-test-product
    restart: unless-stopped
    networks:
      - shiyiju-test
    ports:
      - "8082:8082"
    environment:
      SERVICE: product
      SPRING_PROFILES_ACTIVE: test
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/shiyiju_test?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: test_password_2026
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      - mysql
      - redis

  order-service:
    image: shiyiju-test-backend:latest
    container_name: shiyiju-test-order
    restart: unless-stopped
    networks:
      - shiyiju-test
    ports:
      - "8083:8083"
    environment:
      SERVICE: order
      SPRING_PROFILES_ACTIVE: test
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/shiyiju_test?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: test_password_2026
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      - mysql
      - redis

  file-service:
    image: shiyiju-test-backend:latest
    container_name: shiyiju-test-file
    restart: unless-stopped
    networks:
      - shiyiju-test
    ports:
      - "8087:8087"
    environment:
      SERVICE: file
      SPRING_PROFILES_ACTIVE: test
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/shiyiju_test?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: test_password_2026
      UPLOAD_LOCAL_PATH: /data/uploads
    volumes:
      - uploads-data:/data/uploads
    depends_on:
      - mysql

  # ======================== 前端 ========================

  frontend:
    image: nginx:alpine
    container_name: shiyiju-test-frontend
    restart: unless-stopped
    networks:
      - shiyiju-test
    ports:
      - "80:80"
    volumes:
      - ../frontend/dist:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - gateway

volumes:
  mysql-data:
  redis-data:
  uploads-data:
