server {
    listen 80;
    server_name a.art1.cn;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    # 固定协议页直达入口，避免不同环境对目录索引处理不一致
    location = /agreement {
        try_files /agreement/index.html =404;
    }

    location = /agreement/ {
        try_files /agreement/index.html =404;
    }

    location = /privacy {
        try_files /privacy/index.html =404;
    }

    location = /privacy/ {
        try_files /privacy/index.html =404;
    }

    location = /apple-app-site-association {
        default_type application/json;
        try_files $uri =404;
    }

    location = /.well-known/apple-app-site-association {
        default_type application/json;
        try_files $uri =404;
    }

    # HTML 入口不要缓存，避免 WebView/浏览器继续使用旧的资源入口文件
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files $uri =404;
    }

    # 带 hash 的静态资源允许长期缓存
    location ~* \.(?:js|css|png|jpe?g|gif|svg|webp|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # 应用主域名展示 H5 应用首页
    # SPA fallback
    location / {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # API 代理到网关
    location ^~ /api/ {
        proxy_pass http://gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 微信支付回调直达网关，由网关路由到订单服务
    location ^~ /pay/callback/ {
        proxy_pass http://gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 文件上传代理
    location ^~ /upload/ {
        proxy_pass http://gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
