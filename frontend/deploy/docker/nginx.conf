# 艺本艺术前端 Nginx 配置
# 该配置默认静态文件已经直接位于 /usr/share/nginx/html，
# 例如通过 Dockerfile 复制 dist/build/h5/ 到该目录。

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 固定协议页直达入口，避免目录索引差异
    location = /agreement {
        try_files /agreement/index.html =404;
    }

    location = /agreement/ {
        try_files /agreement/index.html =404;
    }

    location = /privacy {
        try_files /privacy/index.html =404;
    }

    location = /privacy/ {
        try_files /privacy/index.html =404;
    }

    # Vue Router History 模式
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 代理
    location /api/ {
        proxy_pass http://gateway:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json application/javascript;
}
